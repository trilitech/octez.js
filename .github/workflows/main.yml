name: Node.js CI

on:
  pull_request:
    paths-ignore:
      - 'website/**'
  push:
    branches:
      - master
  # Lets a maintainer kick off the shadownet suite (4 shards + sapling) on demand
  # from the Actions UI, without waiting for a qualifying push/PR.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref != 'refs/heads/master' || github.run_number }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

permissions:
  actions: read
  contents: read

jobs:
  integration-tests-change-filter:
    runs-on: ubuntu-latest
    outputs:
      run_expensive: ${{ steps.filter.outputs.run_expensive }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: echo "run_expensive=$(node scripts/should-run-expensive-integration.js)" >> "$GITHUB_OUTPUT"

  http-utils-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node:
          - '22'
          - '24'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npx -y npm@11 ci
      - run: npx nx build @tezos-x/octez.js-http-utils
      - run: npx nx test @tezos-x/octez.js-http-utils -- --coverage

  browser-package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npx -y npm@11 ci
      - run: google-chrome --version
      - run: npm run test:browser:packages

  lint-and-test:
    name: build-lint-docs-unit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        node:
          - 'lts/Jod'
          - '24'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npx -y npm@11 ci
      - run: npm run build
      - run: npm run test:scripts
      - run: npm run test:dist:esm-imports
      - run: npm run lint
      - run: npm run build-docs
      - run: npm run test
      - name: Codecov
        uses: codecov/codecov-action@v6
        with:
          files: packages/**/coverage/coverage-final.json
          use_oidc: true
        env:
          CI: true
          RUN_INTEGRATION: true

  integration-tests-testnet:
    # Manual only: run via "Run workflow" in the Actions UI. No longer runs
    # automatically on push/PR — the shadownet suite is opt-in on demand.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    name: integration-tests-shadownet-shard-${{ matrix.shard }}
    needs:
      - integration-tests-change-filter
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    # Keygen runs as a service container alongside the job (reachable on
    # localhost:3000). Each worker gets a fresh funded key, so no shared secret key
    # and no per-key concurrency group are needed.
    #
    # Funding: each shard's keygen funds from its OWN master account
    # (KEYGEN_MASTER_KEY_<shard>) over RPC, instead of the public faucet. One
    # account per shard keeps the master counters independent across the 4 parallel
    # keygen processes (a single shared key would collide). The keygen serializes
    # injections per process and waits for confirmation, so returned keys are baked.
    services:
      keygen:
        image: ghcr.io/trilitech/octezjs-keygen:latest
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PULL_TOKEN }}
        env:
          KEYGEN_TOKEN: ${{ secrets.KEYGEN_TOKEN }}
          ALLOWED_NETWORKS: shadownet
          RPC_URL: https://rpc.shadownet.teztnets.com
          MASTER_KEY: ${{ secrets[format('KEYGEN_MASTER_KEY_{0}', matrix.shard)] }}
          DEFAULT_FUND_TEZ: '10'
          FUND_HEADROOM_TEZ: '1'
          # Reclaim disabled: its TTL sweep raced still-running tests (emptied a
          # key mid-test -> balance_too_low). The auto top-up covers the drain.
          RECLAIM_ENABLED: 'false'
        ports:
          - 3000:3000
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # Fund THIS shard's keygen master (by address, via faucet) right here in the
      # shard job — not as a separate pre-flight job — so that "Re-run failed jobs"
      # can never start a shard against a drained master. Idempotent: a healthy
      # master is a fast no-op. Only this shard's own account is touched, so the
      # four shards never contend on a counter. Best-effort (never fails the job).
      - name: Top up this shard's keygen master
        env:
          MIN_BALANCE_TEZ: '1200'
          TARGET_TEZ: '1600'
          RPC_URL: https://rpc.shadownet.teztnets.com
          FAUCET_URL: https://faucet.shadownet.teztnets.com
        run: |
          export PKHS="$(node .github/scripts/testnet-master-pkh.mjs '${{ matrix.shard }}')"
          node .github/scripts/topup-keygen-masters.mjs
      - name: Wait for keygen service
        run: bash .github/scripts/wait-for-keygen.sh
      - id: run-tests
        shell: bash
        run: |
          set -euo pipefail
          start_epoch="$(date +%s)"
          start_iso="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          set +e
          npm -w integration-tests run test:shadownet:shard -- \
            --shard=${{ matrix.shard }}/4 \
            --exclude='**/sapling/**' \
            --exclude='**/ledger/**'
          test_exit_code="$?"
          set -e

          end_epoch="$(date +%s)"
          end_iso="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          elapsed_seconds="$((end_epoch - start_epoch))"

          mkdir -p ci-metrics
          cat > "ci-metrics/itest-shadownet-${SHARD}.json" <<EOF
          {"suite":"shadownet","shard":${SHARD},"status":"$([ "$test_exit_code" -eq 0 ] && echo pass || echo fail)","exit_code":$test_exit_code,"elapsed_seconds":$elapsed_seconds,"started_at":"$start_iso","completed_at":"$end_iso","run_id":"${RUN_ID}","run_attempt":"${RUN_ATTEMPT}","sha":"${COMMIT_SHA}"}
          EOF

          # shellcheck disable=SC2129
          echo "### Integration timing: shadownet shard ${SHARD}" >> "$GITHUB_STEP_SUMMARY"
          echo "- status: $([ "$test_exit_code" -eq 0 ] && echo pass || echo fail)" >> "$GITHUB_STEP_SUMMARY"
          echo "- exit_code: $test_exit_code" >> "$GITHUB_STEP_SUMMARY"
          echo "- elapsed_seconds: $elapsed_seconds" >> "$GITHUB_STEP_SUMMARY"

          exit "$test_exit_code"
        env:
          TAQUITO_KEYGEN_URL: http://localhost:3000
          TAQUITO_KEYGEN_TOKEN: ${{ secrets.KEYGEN_TOKEN }}
          # The keygen funds from a master account and waits for confirmation, so
          # returned keys are baked. The request timeout MUST exceed the time the
          # keygen spends waiting for a funding op to confirm: if the client gives
          # up first, the master has already spent the tez but the funded key is
          # never returned -> an orphaned, unreclaimable key. Under shadownet load
          # confirmation regularly exceeded the old 60s, so a single slow shard
          # orphaned dozens of keys (each client retry funds a NEW key), draining
          # ~1000 tez/run. Longer timeout + fewer attempts caps that leak.
          TAQUITO_FRESH_KEY_RETRY_MS: '12000'
          TAQUITO_FRESH_KEY_MAX_ATTEMPTS: '3'
          # 2, not the previous 1: each distinct min-balance bucket gets its own
          # prefetch buffer, and a buffered-but-never-consumed key is a second,
          # narrower version of the leak above (funded, delivered, but no test
          # ever takes it -> no reclaim runs, since reclaim only fires for keys a
          # test actually received). 2 is taquito's own client-side default;
          # ushuaianet.yml already runs 4. Watch keygen container logs for
          # balance warnings before raising further.
          TAQUITO_FRESH_KEY_PREFETCH: '2'
          TAQUITO_KEYGEN_REQUEST_TIMEOUT_MS: '180000'
          # Retry transient shadownet RPC gateway errors (502/503/504) on
          # idempotent calls; the default is 1 retry.
          TAQUITO_HTTP_RETRY_COUNT: '4'
          SHARD: ${{ matrix.shard }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          COMMIT_SHA: ${{ github.sha }}
          TAQUITO_ITEST_DIAGNOSTICS: 'true'
          TAQUITO_DIAG_BALANCE_WARN_MUTEZ: '9000000'
      - name: Keygen container logs
        if: always()
        run: docker logs "${{ job.services.keygen.id }}" 2>&1 | tail -300 || true
      - name: Upload timing artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: itest-timing-shadownet-${{ matrix.shard }}
          path: ci-metrics/itest-shadownet-${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 30

  integration-tests-sapling:
    # Manual only: see integration-tests-testnet above.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    name: integration-tests-shadownet-sapling
    needs:
      - integration-tests-change-filter
    runs-on: ubuntu-latest
    concurrency:
      # shares key 1 with shadownet shard 1; same group serializes them.
      group: shadownet-key-1
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          # Pull the sapling .params binaries tracked by git-lfs
          # (packages/octez.js-sapling/params/*.params) instead of
          # downloading them from the mirror in gs://tezos-linux-repo at run time.
          lfs: true
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify sapling params (git-lfs)
        run: |
          set -euo pipefail
          params_dir="packages/octez.js-sapling/params"
          manifest="packages/octez.js-sapling/src/sapling-params-manifest.json"
          for f in spend output; do
            if grep -qa '^version https://git-lfs' "$params_dir/$f.params"; then
              echo "::error::$f.params is still a git-lfs pointer — checkout did not fetch LFS objects (the job needs 'lfs: true')." >&2
              exit 1
            fi
          done
          spend_sha="$(node -p "require('./$manifest').spendParams.sha256")"
          output_sha="$(node -p "require('./$manifest').outputParams.sha256")"
          echo "${spend_sha}  ${params_dir}/spend.params"   | sha256sum -c -
          echo "${output_sha}  ${params_dir}/output.params" | sha256sum -c -
      - id: run-tests
        shell: bash
        run: |
          set -euo pipefail
          start_epoch="$(date +%s)"
          start_iso="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          set +e
          npm -w integration-tests run test:shadownet-secret-key -- sapling
          test_exit_code="$?"
          set -e

          end_epoch="$(date +%s)"
          end_iso="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          elapsed_seconds="$((end_epoch - start_epoch))"

          mkdir -p ci-metrics
          cat > "ci-metrics/itest-sapling.json" <<EOF
          {"suite":"sapling","status":"$([ "$test_exit_code" -eq 0 ] && echo pass || echo fail)","exit_code":$test_exit_code,"elapsed_seconds":$elapsed_seconds,"started_at":"$start_iso","completed_at":"$end_iso","run_id":"${RUN_ID}","run_attempt":"${RUN_ATTEMPT}","sha":"${COMMIT_SHA}"}
          EOF

          # shellcheck disable=SC2129
          echo "### Integration timing: sapling" >> "$GITHUB_STEP_SUMMARY"
          echo "- status: $([ "$test_exit_code" -eq 0 ] && echo pass || echo fail)" >> "$GITHUB_STEP_SUMMARY"
          echo "- exit_code: $test_exit_code" >> "$GITHUB_STEP_SUMMARY"
          echo "- elapsed_seconds: $elapsed_seconds" >> "$GITHUB_STEP_SUMMARY"

          exit "$test_exit_code"
        env:
          SECRET_KEY: ${{ secrets.SHADOWNET_SECRET_KEY_1 }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          COMMIT_SHA: ${{ github.sha }}
          TAQUITO_ITEST_DIAGNOSTICS: 'true'
          TAQUITO_DIAG_BALANCE_WARN_MUTEZ: '9000000'
          SAPLING_SPEND_PARAMS_PATH: ${{ github.workspace }}/packages/octez.js-sapling/params/spend.params
          SAPLING_OUTPUT_PARAMS_PATH: ${{ github.workspace }}/packages/octez.js-sapling/params/output.params
      - name: Upload timing artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: itest-timing-sapling
          path: ci-metrics/itest-sapling.json
          if-no-files-found: warn
          retention-days: 30

  weeklynet-resolve-rpc:
    # Weeklynet has no stable hostname — it resets onto a new dated host
    # every Wednesday (rpc.weeklynet-<date>.teztnets.com) — so it can't be
    # hardcoded the way shadownet/ushuaianet's fixed hostnames are. Resolved
    # once here, in a job with no services, because a service container's
    # env is fixed at job start and can't consume a lookup step run first in
    # the SAME job (see weeklynet-originate / integration-tests-weeklynet
    # below, which depend on this job's outputs for exactly that reason).
    if: ${{ needs.integration-tests-change-filter.outputs.run_expensive == 'true' }}
    needs:
      - integration-tests-change-filter
    runs-on: ubuntu-latest
    outputs:
      rpc_url: ${{ steps.resolve.outputs.rpc_url }}
      faucet_url: ${{ steps.resolve.outputs.faucet_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - id: resolve
        run: node .github/scripts/resolve-weeklynet.mjs

  weeklynet-originate:
    # Weeklynet's weekly reset wipes any previously originated contracts too,
    # not just the RPC host: known-contracts-weeklynet.ts committed to the
    # repo goes stale on the same schedule. Re-originate the 6 known
    # contracts fresh on every automated run, from a single ephemeral key,
    # and hand the resulting addresses to the shard matrix below as outputs.
    if: ${{ needs.integration-tests-change-filter.outputs.run_expensive == 'true' }}
    needs:
      - integration-tests-change-filter
      - weeklynet-resolve-rpc
    runs-on: ubuntu-latest
    services:
      keygen:
        image: ghcr.io/trilitech/octezjs-keygen:latest
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PULL_TOKEN }}
        env:
          KEYGEN_TOKEN: ${{ secrets.KEYGEN_TOKEN }}
          ALLOWED_NETWORKS: weeklynet
          RPC_URL: ${{ needs.weeklynet-resolve-rpc.outputs.rpc_url }}
          FAUCET_URL: ${{ needs.weeklynet-resolve-rpc.outputs.faucet_url }}
          MASTER_KEY: ${{ secrets.KEYGEN_MASTER_KEY_1 }}
          DEFAULT_FUND_TEZ: '10'
          FUND_HEADROOM_TEZ: '1'
          # Same master accounts as shadownet (see testnet-master-pkh.mjs),
          # now funded on weeklynet too: they're baked into weeklynet's
          # genesis bootstrap on every weekly reset, so — unlike before —
          # they survive the reset instead of being wiped by it. Runs before
          # the shard matrix below (via `needs`), so master 1 is never used
          # concurrently with shard 1's own use of it.
          RECLAIM_ENABLED: 'false'
        ports:
          - 3000:3000
    outputs:
      contract: ${{ steps.addresses.outputs.contract }}
      big_map_contract: ${{ steps.addresses.outputs.big_map_contract }}
      tzip1216_contract: ${{ steps.addresses.outputs.tzip1216_contract }}
      sapling_contract: ${{ steps.addresses.outputs.sapling_contract }}
      view_contract: ${{ steps.addresses.outputs.view_contract }}
      ticket_contract: ${{ steps.addresses.outputs.ticket_contract }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Top up keygen master 1
        env:
          MIN_BALANCE_TEZ: '1200'
          TARGET_TEZ: '1600'
          RPC_URL: ${{ needs.weeklynet-resolve-rpc.outputs.rpc_url }}
          FAUCET_URL: ${{ needs.weeklynet-resolve-rpc.outputs.faucet_url }}
        run: |
          export PKHS="$(node .github/scripts/testnet-master-pkh.mjs 1)"
          node .github/scripts/topup-keygen-masters.mjs
      - name: Wait for keygen service
        run: bash .github/scripts/wait-for-keygen.sh
      - name: Originate known contracts on weeklynet
        run: npm -w integration-tests run originate-known-contracts
        env:
          WEEKLYNET: 'true'
          TEZOS_RPC_WEEKLYNET: ${{ needs.weeklynet-resolve-rpc.outputs.rpc_url }}
          TAQUITO_KEYGEN_URL: http://localhost:3000
          TAQUITO_KEYGEN_TOKEN: ${{ secrets.KEYGEN_TOKEN }}
          TAQUITO_KEYGEN_REQUEST_TIMEOUT_MS: '180000'
          # Never set before, because this step never used to check balance
          # at all (that was 403fcfa22's bug). Now that it does: each retry
          # attempt pulls a brand-new candidate key from the prefetch pool
          # (setupSignerWithFreshKey in config.ts), not a re-check of the
          # same one — with the previous defaults (5 attempts, 0ms between
          # them), every candidate got discarded for a fresh one before its
          # funding tx had any chance to confirm. Same fix the shard jobs
          # below already needed for the same reason; matching their values.
          TAQUITO_FRESH_KEY_MAX_ATTEMPTS: '8'
          TAQUITO_FRESH_KEY_RETRY_MS: '12000'
      - id: addresses
        name: Read originated addresses
        run: node .github/scripts/read-known-contracts.mjs weeklynet
      - name: Keygen container logs
        if: always()
        run: docker logs "${{ job.services.keygen.id }}" 2>&1 | tail -300 || true

  integration-tests-weeklynet:
    # Runs automatically (unlike the shadownet matrix above) — see
    # weeklynet-resolve-rpc / weeklynet-originate for why this needs two
    # pre-flight jobs instead of the fixed RPC_URL and committed
    # known-contracts shadownet/ushuaianet use directly.
    #
    # No sapling counterpart: the sapling job needs a static, long-lived
    # secret key with a pre-initialized shielded-pool balance, which can't
    # survive a weekly full chain reset the way shadownet/ushuaianet's
    # persistent SECRET_KEY does — out of scope until weeklynet has its own
    # shielded-pool re-init story.
    if: ${{ needs.integration-tests-change-filter.outputs.run_expensive == 'true' }}
    name: integration-tests-weeklynet-shard-${{ matrix.shard }}
    needs:
      - integration-tests-change-filter
      - weeklynet-resolve-rpc
      - weeklynet-originate
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    # Same master accounts as shadownet's matrix above (see
    # testnet-master-pkh.mjs) — one per shard, funded on weeklynet too and
    # now baked into its genesis bootstrap on every weekly reset, so they
    # survive the reset instead of being wiped by it.
    services:
      keygen:
        image: ghcr.io/trilitech/octezjs-keygen:latest
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PULL_TOKEN }}
        env:
          KEYGEN_TOKEN: ${{ secrets.KEYGEN_TOKEN }}
          ALLOWED_NETWORKS: weeklynet
          RPC_URL: ${{ needs.weeklynet-resolve-rpc.outputs.rpc_url }}
          FAUCET_URL: ${{ needs.weeklynet-resolve-rpc.outputs.faucet_url }}
          MASTER_KEY: ${{ secrets[format('KEYGEN_MASTER_KEY_{0}', matrix.shard)] }}
          DEFAULT_FUND_TEZ: '10'
          FUND_HEADROOM_TEZ: '1'
          RECLAIM_ENABLED: 'false'
        ports:
          - 3000:3000
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Top up this shard's keygen master
        env:
          MIN_BALANCE_TEZ: '1200'
          TARGET_TEZ: '1600'
          RPC_URL: ${{ needs.weeklynet-resolve-rpc.outputs.rpc_url }}
          FAUCET_URL: ${{ needs.weeklynet-resolve-rpc.outputs.faucet_url }}
        run: |
          export PKHS="$(node .github/scripts/testnet-master-pkh.mjs '${{ matrix.shard }}')"
          node .github/scripts/topup-keygen-masters.mjs
      - name: Wait for keygen service
        run: bash .github/scripts/wait-for-keygen.sh
      - id: run-tests
        shell: bash
        run: |
          set -euo pipefail
          start_epoch="$(date +%s)"
          start_iso="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          set +e
          npm -w integration-tests run test:weeklynet:shard -- \
            --shard=${{ matrix.shard }}/4 \
            --exclude='**/sapling/**' \
            --exclude='**/ledger/**'
          test_exit_code="$?"
          set -e

          end_epoch="$(date +%s)"
          end_iso="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          elapsed_seconds="$((end_epoch - start_epoch))"

          mkdir -p ci-metrics
          cat > "ci-metrics/itest-weeklynet-${SHARD}.json" <<EOF
          {"suite":"weeklynet","shard":${SHARD},"status":"$([ "$test_exit_code" -eq 0 ] && echo pass || echo fail)","exit_code":$test_exit_code,"elapsed_seconds":$elapsed_seconds,"started_at":"$start_iso","completed_at":"$end_iso","run_id":"${RUN_ID}","run_attempt":"${RUN_ATTEMPT}","sha":"${COMMIT_SHA}"}
          EOF

          # shellcheck disable=SC2129
          echo "### Integration timing: weeklynet shard ${SHARD}" >> "$GITHUB_STEP_SUMMARY"
          echo "- status: $([ "$test_exit_code" -eq 0 ] && echo pass || echo fail)" >> "$GITHUB_STEP_SUMMARY"
          echo "- exit_code: $test_exit_code" >> "$GITHUB_STEP_SUMMARY"
          echo "- elapsed_seconds: $elapsed_seconds" >> "$GITHUB_STEP_SUMMARY"

          exit "$test_exit_code"
        env:
          TEZOS_RPC_WEEKLYNET: ${{ needs.weeklynet-resolve-rpc.outputs.rpc_url }}
          TEZOS_WEEKLYNET_CONTRACT_ADDRESS: ${{ needs.weeklynet-originate.outputs.contract }}
          TEZOS_WEEKLYNET_BIGMAPCONTRACT_ADDRESS: ${{ needs.weeklynet-originate.outputs.big_map_contract }}
          TEZOS_WEEKLYNET_TZIP1216CONTRACT_ADDRESS: ${{ needs.weeklynet-originate.outputs.tzip1216_contract }}
          TEZOS_WEEKLYNET_SAPLINGCONTRACT_ADDRESS: ${{ needs.weeklynet-originate.outputs.sapling_contract }}
          TEZOS_WEEKLYNET_ON_CHAIN_VIEW_CONTRACT: ${{ needs.weeklynet-originate.outputs.view_contract }}
          TEZOS_WEEKLYNET_TICKET_CONTRACT: ${{ needs.weeklynet-originate.outputs.ticket_contract }}
          TAQUITO_KEYGEN_URL: http://localhost:3000
          TAQUITO_KEYGEN_TOKEN: ${{ secrets.KEYGEN_TOKEN }}
          # Higher than shadownet's 3/2, left as-is for now: this was tuned
          # for weeklynet's old faucet-funded path (observed ~4-5
          # exhaustions/shard over a full run under 4-shard concurrent load),
          # which is no longer how these keys are funded now that weeklynet
          # uses the same master-account funding as shadownet (see
          # testnet-master-pkh.mjs). Worth revisiting once that's been
          # observed live — not tightened blindly here.
          TAQUITO_FRESH_KEY_RETRY_MS: '12000'
          TAQUITO_FRESH_KEY_MAX_ATTEMPTS: '6'
          TAQUITO_FRESH_KEY_PREFETCH: '1'
          TAQUITO_KEYGEN_REQUEST_TIMEOUT_MS: '180000'
          TAQUITO_HTTP_RETRY_COUNT: '4'
          SHARD: ${{ matrix.shard }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          COMMIT_SHA: ${{ github.sha }}
          TAQUITO_ITEST_DIAGNOSTICS: 'true'
          TAQUITO_DIAG_BALANCE_WARN_MUTEZ: '9000000'
      - name: Keygen container logs
        if: always()
        run: docker logs "${{ job.services.keygen.id }}" 2>&1 | tail -300 || true
      - name: Upload timing artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: itest-timing-weeklynet-${{ matrix.shard }}
          path: ci-metrics/itest-weeklynet-${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 30

  rpc-health-monitor:
    # Manual only: this exists to correlate RPC weather with the shadownet/
    # ushuaianet test window, which is itself manual now (see
    # integration-tests-testnet above).
    if: ${{ github.event_name == 'workflow_dispatch' }}
    name: rpc-health-monitor-${{ matrix.network.name }}
    needs:
      - integration-tests-change-filter
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        network:
          - name: shadownet
            rpc_url: https://rpc.shadownet.teztnets.com
          - name: ushuaianet
            rpc_url: https://rpc.ushuaianet.teztnets.com
    # Diagnostics only: this never gates a merge, it just records an RPC weather
    # report over the test window so failures can be correlated with node health.
    continue-on-error: true
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - name: Poll ${{ matrix.network.name }} RPC health
        env:
          RPC_URL: ${{ matrix.network.rpc_url }}
          POLL_INTERVAL_SECONDS: '15'
          POLL_MAX_DURATION_SECONDS: '1860'
          POLL_STOP_WHEN_RUN_JOBS_COMPLETE: 'true'
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/scripts/poll-rpc-health.sh
      - name: Upload RPC health timeline
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rpc-health-${{ matrix.network.name }}
          path: ci-metrics/rpc-health.jsonl
          if-no-files-found: warn
          retention-days: 30


  integration-tests-timing-summary:
    needs:
      - integration-tests-change-filter
      - integration-tests-testnet
      - integration-tests-sapling
    if: ${{ always() && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download timing artifacts
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: itest-timing-*
          path: ci-metrics
          merge-multiple: true
      - name: Render timing summary
        shell: bash
        run: |
          set -euo pipefail

          echo "## Integration timing summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if ! ls ci-metrics/*.json >/dev/null 2>&1; then
            echo "No timing artifacts found for this run." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # shellcheck disable=SC2129
          echo "| suite | shard | status | elapsed_seconds | exit_code | started_at | completed_at |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---:|---|---:|---:|---|---|" >> "$GITHUB_STEP_SUMMARY"
          jq -s -r '
            sort_by(.suite, .shard)
            | .[]
            | "| \(.suite) | \(.shard) | \(.status) | \(.elapsed_seconds) | \(.exit_code) | \(.started_at) | \(.completed_at) |"
          ' ci-metrics/*.json >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Raw timing JSON artifacts are attached to this run under names matching \`itest-timing-*\`." >> "$GITHUB_STEP_SUMMARY"
