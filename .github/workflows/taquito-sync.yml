name: Taquito Upstream Sync

# Weekly drift check against upstream ecadlabs/taquito's main branch. Maintains
# a single always-up-to-date GitHub tracking issue (found by title + label,
# never re-created) listing new upstream commits grouped by package and type.
# The review checkpoint (last-reviewed upstream SHA) lives inside the issue
# body itself, not in a repo file — see .github/scripts/taquito-sync.mjs.

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print the computed issue instead of creating/updating it for real'
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      # gh issue create --label fails if the label doesn't already exist in
      # the repo, which would otherwise break the very first run. --force
      # makes this idempotent (no-op once the label exists).
      - run: gh label create "${ISSUE_LABEL:-taquito-sync}" --color BFD4F2 --force
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_LABEL: ${{ vars.ISSUE_LABEL }}
      - run: node .github/scripts/taquito-sync.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          # Must match the label step above — otherwise a repo-level ISSUE_LABEL
          # override creates a label the script never looks for.
          ISSUE_LABEL: ${{ vars.ISSUE_LABEL }}
          # Scheduled runs are always live. Manual (workflow_dispatch) runs default
          # to dry-run so the tracker issue can't be mutated by accident.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || '' }}
