name: Weeklynet Weekly Integration Suite

# Runs the same weeklynet integration suite that main.yml already runs on every
# qualifying push (see weeklynet-resolve-rpc / weeklynet-originate /
# integration-tests-weeklynet there for why weeklynet needs its own RPC
# resolution + fresh contract origination every run), but on a standalone
# weekly schedule instead of push/PR. This exists so weeklynet drift is caught
# even during a quiet week with no octez.js pushes. main.yml's push-triggered
# lane is untouched by this file — the three jobs below are a deliberate
# duplicate, not a refactor of main.yml, to avoid touching the existing,
# load-bearing push CI for this addition.
#
# On every run — pass or fail — weeklynet-notify finds-or-creates a single
# evergreen, labelled GitHub issue linking to the run so a maintainer can look
# at the CI artifacts themselves — see
# .github/scripts/weeklynet-failure-notify.mjs for why this deliberately does
# not attempt a per-test diff against prior runs. Like taquito-sync.yml's
# tracker issue, its header always carries the last commit tested and the
# last checked date, and it is never closed by the script: only reopened if a
# human closed it, regardless of pass/fail. A human decides when to close it.

on:
  schedule:
    # Sunday 03:00 UTC. Deliberately NOT a weekday time close to main.yml's
    # own push-triggered weeklynet lane: this workflow has no concurrency
    # group shared with main.yml's weeklynet-resolve-rpc/originate/shard
    # jobs, so an overlapping run would mean 8 shards + 2 originate jobs
    # hitting the same public faucet and the same KEYGEN_TOKEN at once, on
    # top of main.yml's own comments noting 4 concurrent shards is already
    # the untested edge for faucet contention. Sunday early morning UTC is
    # the lowest-push-likelihood slot available without adding cross-workflow
    # concurrency groups to main.yml itself (out of scope for this addition —
    # flagged, not silently worked around).
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print the computed notify action/issue body instead of creating/updating/closing the tracker issue for real'
        type: boolean
        default: true

concurrency:
  group: weeklynet-weekly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  weeklynet-resolve-rpc:
    # Weeklynet has no stable hostname — it resets onto a new dated host every
    # Wednesday (rpc.weeklynet-<date>.teztnets.com), so it can't be hardcoded
    # the way shadownet/ushuaianet's fixed hostnames are. Resolved once here,
    # in a job with no services, because a service container's env is fixed
    # at job start and can't consume a lookup step run first in the SAME job
    # (see weeklynet-originate / integration-tests-weeklynet below, which
    # depend on this job's outputs for exactly that reason).
    runs-on: ubuntu-latest
    outputs:
      rpc_url: ${{ steps.resolve.outputs.rpc_url }}
      faucet_url: ${{ steps.resolve.outputs.faucet_url }}
      # Supplementary version info (teztnets.com/weeklynet-about), not used
      # to configure the test run itself — only surfaced in the
      # weeklynet-notify tracker issue below.
      activated_on: ${{ steps.resolve.outputs.activated_on }}
      docker_build: ${{ steps.resolve.outputs.docker_build }}
      git_ref: ${{ steps.resolve.outputs.git_ref }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - id: resolve
        run: node .github/scripts/resolve-weeklynet.mjs

  weeklynet-originate:
    # Weeklynet's weekly reset wipes any previously originated contracts too,
    # not just the RPC host: known-contracts-weeklynet.ts committed to the
    # repo goes stale on the same schedule. Re-originate the 6 known
    # contracts fresh on every automated run, from a single ephemeral key,
    # and hand the resulting addresses to the shard matrix below as outputs.
    needs:
      - weeklynet-resolve-rpc
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      keygen:
        image: ghcr.io/trilitech/octezjs-keygen:latest
        credentials:
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PULL_TOKEN }}
        env:
          KEYGEN_TOKEN: ${{ secrets.KEYGEN_TOKEN }}
          ALLOWED_NETWORKS: weeklynet
          RPC_URL: ${{ needs.weeklynet-resolve-rpc.outputs.rpc_url }}
          FAUCET_URL: ${{ needs.weeklynet-resolve-rpc.outputs.faucet_url }}
          DEFAULT_FUND_TEZ: '10'
          FUND_HEADROOM_TEZ: '1'
          # No MASTER_KEY: a persistent master account would just be wiped by
          # the next reset too, so this (and the shard matrix below) fund
          # every key on demand via the faucet's PoW challenge instead of a
          # pre-funded account, unlike shadownet/ushuaianet. Slower and more
          # exposed to faucet flakiness — accepted for now; revisit if that
          # proves too unreliable in practice.
          RECLAIM_ENABLED: 'false'
        ports:
          - 3000:3000
    outputs:
      contract: ${{ steps.addresses.outputs.contract }}
      big_map_contract: ${{ steps.addresses.outputs.big_map_contract }}
      tzip1216_contract: ${{ steps.addresses.outputs.tzip1216_contract }}
      sapling_contract: ${{ steps.addresses.outputs.sapling_contract }}
      view_contract: ${{ steps.addresses.outputs.view_contract }}
      ticket_contract: ${{ steps.addresses.outputs.ticket_contract }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Wait for keygen service
        run: bash .github/scripts/wait-for-keygen.sh
      - name: Originate known contracts on weeklynet
        run: npm -w integration-tests run originate-known-contracts
        env:
          WEEKLYNET: 'true'
          TEZOS_RPC_WEEKLYNET: ${{ needs.weeklynet-resolve-rpc.outputs.rpc_url }}
          TAQUITO_KEYGEN_URL: http://localhost:3000
          TAQUITO_KEYGEN_TOKEN: ${{ secrets.KEYGEN_TOKEN }}
          TAQUITO_KEYGEN_REQUEST_TIMEOUT_MS: '180000'
          TAQUITO_FRESH_KEY_MAX_ATTEMPTS: '8'
          TAQUITO_FRESH_KEY_RETRY_MS: '12000'
      - id: addresses
        name: Read originated addresses
        run: node .github/scripts/read-known-contracts.mjs weeklynet
      - name: Keygen container logs
        if: always()
        run: docker logs "${{ job.services.keygen.id }}" 2>&1 | tail -300 || true

  integration-tests-weeklynet:
    # Same shard matrix and exclusions as main.yml's push-triggered
    # integration-tests-weeklynet job. No sapling counterpart: the sapling
    # job needs a static, long-lived secret key with a pre-initialized
    # shielded-pool balance, which can't survive a weekly full chain reset the
    # way shadownet/ushuaianet's persistent SECRET_KEY does — out of scope
    # until weeklynet has its own shielded-pool re-init story.
    name: integration-tests-weeklynet-shard-${{ matrix.shard }}
    needs:
      - weeklynet-resolve-rpc
      - weeklynet-originate
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # No MASTER_KEY, unlike the shadownet matrix in main.yml: a persistent
    # master account would be wiped by weeklynet's own Wednesday reset just
    # like any other account, so every shard funds its ephemeral keys on
    # demand via the faucet instead.
    services:
      keygen:
        image: ghcr.io/trilitech/octezjs-keygen:latest
        credentials:
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PULL_TOKEN }}
        env:
          KEYGEN_TOKEN: ${{ secrets.KEYGEN_TOKEN }}
          ALLOWED_NETWORKS: weeklynet
          RPC_URL: ${{ needs.weeklynet-resolve-rpc.outputs.rpc_url }}
          FAUCET_URL: ${{ needs.weeklynet-resolve-rpc.outputs.faucet_url }}
          DEFAULT_FUND_TEZ: '10'
          FUND_HEADROOM_TEZ: '1'
          RECLAIM_ENABLED: 'false'
        ports:
          - 3000:3000
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Wait for keygen service
        run: bash .github/scripts/wait-for-keygen.sh
      - id: run-tests
        shell: bash
        run: |
          set -euo pipefail
          start_epoch="$(date +%s)"
          start_iso="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          set +e
          npm -w integration-tests run test:weeklynet:shard -- \
            --shard=${{ matrix.shard }}/4 \
            --exclude='**/sapling/**' \
            --exclude='**/ledger/**'
          test_exit_code="$?"
          set -e

          end_epoch="$(date +%s)"
          end_iso="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          elapsed_seconds="$((end_epoch - start_epoch))"

          mkdir -p ci-metrics
          cat > "ci-metrics/itest-timing-weeklynet-weekly-${SHARD}.json" <<EOF
          {"suite":"weeklynet-weekly","shard":${SHARD},"status":"$([ "$test_exit_code" -eq 0 ] && echo pass || echo fail)","exit_code":$test_exit_code,"elapsed_seconds":$elapsed_seconds,"started_at":"$start_iso","completed_at":"$end_iso","run_id":"${RUN_ID}","run_attempt":"${RUN_ATTEMPT}","sha":"${COMMIT_SHA}"}
          EOF

          # shellcheck disable=SC2129
          echo "### Integration timing: weeklynet-weekly shard ${SHARD}" >> "$GITHUB_STEP_SUMMARY"
          echo "- status: $([ "$test_exit_code" -eq 0 ] && echo pass || echo fail)" >> "$GITHUB_STEP_SUMMARY"
          echo "- exit_code: $test_exit_code" >> "$GITHUB_STEP_SUMMARY"
          echo "- elapsed_seconds: $elapsed_seconds" >> "$GITHUB_STEP_SUMMARY"

          exit "$test_exit_code"
        env:
          TEZOS_RPC_WEEKLYNET: ${{ needs.weeklynet-resolve-rpc.outputs.rpc_url }}
          TEZOS_WEEKLYNET_CONTRACT_ADDRESS: ${{ needs.weeklynet-originate.outputs.contract }}
          TEZOS_WEEKLYNET_BIGMAPCONTRACT_ADDRESS: ${{ needs.weeklynet-originate.outputs.big_map_contract }}
          TEZOS_WEEKLYNET_TZIP1216CONTRACT_ADDRESS: ${{ needs.weeklynet-originate.outputs.tzip1216_contract }}
          TEZOS_WEEKLYNET_SAPLINGCONTRACT_ADDRESS: ${{ needs.weeklynet-originate.outputs.sapling_contract }}
          TEZOS_WEEKLYNET_ON_CHAIN_VIEW_CONTRACT: ${{ needs.weeklynet-originate.outputs.view_contract }}
          TEZOS_WEEKLYNET_TICKET_CONTRACT: ${{ needs.weeklynet-originate.outputs.ticket_contract }}
          TAQUITO_KEYGEN_URL: http://localhost:3000
          TAQUITO_KEYGEN_TOKEN: ${{ secrets.KEYGEN_TOKEN }}
          TAQUITO_FRESH_KEY_RETRY_MS: '12000'
          TAQUITO_FRESH_KEY_MAX_ATTEMPTS: '6'
          TAQUITO_FRESH_KEY_PREFETCH: '1'
          TAQUITO_KEYGEN_REQUEST_TIMEOUT_MS: '180000'
          TAQUITO_HTTP_RETRY_COUNT: '4'
          SHARD: ${{ matrix.shard }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          COMMIT_SHA: ${{ github.sha }}
          TAQUITO_ITEST_DIAGNOSTICS: 'true'
          TAQUITO_DIAG_BALANCE_WARN_MUTEZ: '9000000'
      - name: Keygen container logs
        if: always()
        run: docker logs "${{ job.services.keygen.id }}" 2>&1 | tail -300 || true
      - name: Upload timing artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: itest-timing-weeklynet-weekly-${{ matrix.shard }}
          path: ci-metrics/itest-timing-weeklynet-weekly-${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 30

  weeklynet-notify:
    # Runs regardless of pass/fail (if: !cancelled()) so every terminal run
    # touches the tracker issue: creates it if missing, reopens it if a human
    # closed it (pass or fail — see
    # .github/scripts/weeklynet-failure-notify.mjs for the
    # create/reopen/update + comment decision logic), or just refreshes its
    # "last commit tested" / "last checked" header if already open. Never a
    # resolver: only a human closes it.
    #
    # Depends on all three upstream jobs, not just the shard matrix: weeklynet
    # resets onto a new dated host every Wednesday and re-originates its known
    # contracts from a public faucet on every run, which makes
    # weeklynet-resolve-rpc/weeklynet-originate the most likely failure point
    # — exactly the "quiet week" drift this workflow exists to catch. Rolling
    # their result into RUN_RESULT below means a resolve/originate failure
    # (which would otherwise skip the shard matrix and leave RUN_RESULT
    # 'skipped' — no notification at all) still opens the tracker issue.
    name: weeklynet-notify-failure
    needs:
      - weeklynet-resolve-rpc
      - weeklynet-originate
      - integration-tests-weeklynet
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      # gh issue create --label fails if the label doesn't already exist in
      # the repo, which would otherwise break the very first failing run.
      # --force makes this idempotent (no-op once the label exists) — same
      # convention as the label step in taquito-sync.yml.
      - run: gh label create "${ISSUE_LABEL:-weeklynet-regression}" --color B60205 --force
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_LABEL: ${{ vars.WEEKLYNET_ISSUE_LABEL }}
      - name: Download shard timing artifacts
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: itest-timing-weeklynet-weekly-*
          path: ci-metrics
          merge-multiple: true
      # A gh/API hiccup here shouldn't turn an otherwise-passing (or
      # already-notified-failing) run red — this job is best-effort
      # notification, not a gate.
      - continue-on-error: true
        run: node .github/scripts/weeklynet-failure-notify.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_LABEL: ${{ vars.WEEKLYNET_ISSUE_LABEL }}
          RUN_RESULT: ${{ (needs.weeklynet-resolve-rpc.result == 'failure' || needs.weeklynet-originate.result == 'failure') && 'failure' || needs.integration-tests-weeklynet.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          WEEKLYNET_ACTIVATED_ON: ${{ needs.weeklynet-resolve-rpc.outputs.activated_on }}
          WEEKLYNET_DOCKER_BUILD: ${{ needs.weeklynet-resolve-rpc.outputs.docker_build }}
          WEEKLYNET_GIT_REF: ${{ needs.weeklynet-resolve-rpc.outputs.git_ref }}
          # Scheduled runs are always live. Manual (workflow_dispatch) runs
          # default to dry-run so the tracker issue can't be mutated by
          # accident — same convention as taquito-sync.yml.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || '' }}
