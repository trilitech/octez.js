name: Ad Hoc Ushuaianet Integration Tests

on:
  push:
    branches:
      - 'ci/**ushuaia**'
      - 'ci/**ushuaianet**'
      - 'ci/**u025**'

permissions:
  contents: read

jobs:
  integration-tests-ushuaianet:
    name: integration-tests-ushuaianet-push
    runs-on: ubuntu-latest
    continue-on-error: true
    # One keygen master account (KEYGEN_MASTER_KEY_1) funds this job, so two
    # concurrent pushes would collide on its counter: serialize them.
    concurrency:
      group: ushuaianet-keygen-master-1
      cancel-in-progress: false
    # Keygen runs as a service container alongside the job (reachable on
    # localhost:3000), exactly like the shadownet/weeklynet jobs in main.yml:
    # each worker gets a fresh funded key from the master account over RPC.
    services:
      keygen:
        image: ghcr.io/trilitech/octezjs-keygen:latest
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PULL_TOKEN }}
        env:
          KEYGEN_TOKEN: ${{ secrets.KEYGEN_TOKEN }}
          ALLOWED_NETWORKS: ushuaianet
          RPC_URL: https://rpc.ushuaianet.teztnets.com
          MASTER_KEY: ${{ secrets.KEYGEN_MASTER_KEY_1 }}
          DEFAULT_FUND_TEZ: '10'
          FUND_HEADROOM_TEZ: '1'
          # Reclaim disabled for the same reason as in main.yml: its TTL sweep
          # raced still-running tests (emptied a key mid-test).
          RECLAIM_ENABLED: 'false'
        ports:
          - 3000:3000
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # The CI master accounts are funded on shadownet and weeklynet, not on
      # ushuaianet: fund master 1 by address through the ushuaianet faucet
      # (idempotent; a healthy master is a fast no-op). Sized for one full run on a
      # single master (~6,500 tez observed on 2026-10-07: the whole suite with
      # --maxWorkers=4, not a quarter per shard as on shadownet). The faucet grants
      # up to 40,000 tez per request. REQUIRE_MIN_BALANCE makes the job fail here,
      # clearly, if the master is still under the minimum, instead of a suite of
      # opaque "Failed to generate or fund key" errors.
      - name: Top up the keygen master
        env:
          MIN_BALANCE_TEZ: '7000'
          TARGET_TEZ: '8000'
          REQUIRE_MIN_BALANCE: 'true'
          RPC_URL: https://rpc.ushuaianet.teztnets.com
          FAUCET_URL: https://faucet.ushuaianet.teztnets.com
        run: |
          export PKHS="$(node .github/scripts/testnet-master-pkh.mjs 1)"
          node .github/scripts/topup-keygen-masters.mjs
      - name: Wait for keygen service
        run: bash .github/scripts/wait-for-keygen.sh
      - name: Record keygen master balance (before tests)
        run: |
          pkh="$(node .github/scripts/testnet-master-pkh.mjs 1)"
          before="$(curl -fsS "https://rpc.ushuaianet.teztnets.com/chains/main/blocks/head/context/contracts/${pkh}/balance" | tr -d '"')"
          echo "MASTER_PKH=${pkh}" >> "$GITHUB_ENV"
          echo "MASTER_BEFORE_MUTEZ=${before}" >> "$GITHUB_ENV"
      - id: integration-tests-ushuaianet
        run: npm -w integration-tests run test:ushuaianet -- --maxWorkers=4 --exclude='**/sapling/**' --exclude='**/ledger/**'
        env:
          OCTEZJS_KEYGEN_URL: http://localhost:3000
          OCTEZJS_KEYGEN_TOKEN: ${{ secrets.KEYGEN_TOKEN }}
          # The request timeout MUST exceed the time the keygen spends waiting for
          # a funding op to confirm, otherwise a funded key is never returned and
          # is orphaned (see the matching comment in main.yml).
          OCTEZJS_KEYGEN_REQUEST_TIMEOUT_MS: '180000'
          OCTEZJS_FRESH_KEY_RETRY_MS: '12000'
          OCTEZJS_FRESH_KEY_MAX_ATTEMPTS: '3'
          # 2, as in main.yml: each buffered-but-never-consumed key is funded tez
          # that is never used (orphaned), and 4 contributed to this lane's cost.
          OCTEZJS_FRESH_KEY_PREFETCH: '2'
          OCTEZJS_HTTP_RETRY_COUNT: '4'
          OCTEZJS_ITEST_DIAGNOSTICS: 'true'
          OCTEZJS_DIAG_BALANCE_WARN_MUTEZ: '9000000'
      # How much one run really costs, to tune the amounts above (also shown in
      # the job summary). Runs even when the tests fail.
      - name: Report keygen master spend
        if: ${{ always() && env.MASTER_BEFORE_MUTEZ != '' }}
        run: |
          after="$(curl -fsS "https://rpc.ushuaianet.teztnets.com/chains/main/blocks/head/context/contracts/${MASTER_PKH}/balance" | tr -d '"')"
          spent_tez=$(( (MASTER_BEFORE_MUTEZ - after) / 1000000 ))
          {
            echo "### Ushuaianet keygen master spend"
            echo "- master: ${MASTER_PKH}"
            echo "- before: $(( MASTER_BEFORE_MUTEZ / 1000000 )) tez, after: $(( after / 1000000 )) tez"
            echo "- spent by this run: ${spent_tez} tez"
          } | tee -a "$GITHUB_STEP_SUMMARY"
