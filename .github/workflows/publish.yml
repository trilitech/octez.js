name: Publish to npm

on:
  # Trigger on version tags
  push:
    tags:
      - 'v*'
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no actual publish)'
        required: false
        default: 'false'
        type: boolean

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for npm provenance / trusted publishing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/Jod'
          registry-url: 'https://registry.npmjs.org'

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev libudev-dev

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build

      - name: Run tests
        run: npm run test -- --runInBand

      - name: Publish (dry run)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: |
          for pkg in packages/*/; do
            if [ -f "$pkg/package.json" ]; then
              echo "=== Dry run: $pkg ==="
              cd "$pkg"
              npm publish --dry-run --access public
              cd -
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}

      - name: Publish to npm
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          # Token management - switch tokens on rate limit
          CURRENT_TOKEN="$NPM_TOKEN_1"
          USE_TOKEN_2=false

          switch_token() {
            if [ "$USE_TOKEN_2" = false ] && [ -n "$NPM_TOKEN_2" ]; then
              echo "Switching to backup token..."
              CURRENT_TOKEN="$NPM_TOKEN_2"
              USE_TOKEN_2=true
              # Update npm config with new token
              npm config set //registry.npmjs.org/:_authToken "$CURRENT_TOKEN"
              return 0
            fi
            return 1
          }

          publish_with_retry() {
            local pkg="$1"
            local max_retries=3
            local retry=0
            local wait=10

            while [ $retry -lt $max_retries ]; do
              output=$(npm publish --access public 2>&1) && echo "$output" && return 0

              if echo "$output" | grep -q "E429\|429 Too Many Requests\|rate limit"; then
                retry=$((retry + 1))
                echo "Rate limited with current token, retry $retry/$max_retries..."

                # Try switching token after first rate limit
                if [ $retry -eq 1 ]; then
                  if switch_token; then
                    echo "Retrying with backup token..."
                    continue
                  fi
                fi

                echo "Waiting ${wait}s..."
                sleep $wait
                wait=$((wait * 2))
              elif echo "$output" | grep -q "E403\|previously published"; then
                echo "Already published, skipping"
                return 0
              else
                echo "$output"
                return 0
              fi
            done
            echo "Failed after $max_retries retries"
            return 1
          }

          # Initialize with first token
          npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN_1"

          for pkg in packages/*/; do
            if [ -f "$pkg/package.json" ]; then
              echo "=== Publishing $pkg ==="
              cd "$pkg"
              publish_with_retry "$pkg" || true
              cd -
            fi
          done
        env:
          NPM_TOKEN_1: ${{ secrets.NPM_ACCESS_TOKEN }}
          NPM_TOKEN_2: ${{ secrets.NPM_ACCESS_TOKEN_2 }}
